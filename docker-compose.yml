services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: devforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devforge
      POSTGRES_PASSWORD: devforge_password
      POSTGRES_DB: devforge
    ports:
      - "5433:5432"
    volumes:
      - devforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devforge -d devforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: devforge-backend
    container_name: devforge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000

      DATABASE_URL: "postgresql://devforge:devforge_password@postgres:5432/devforge"

      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "7d"

      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      GITHUB_CALLBACK_URL: "http://localhost:5000/api/v1/github/callback"

      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      SHADOW_DATABASE_URL: "${SHADOW_DATABASE_URL}"

      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash}"

      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "5000:5000"

  frontend:
    image: devforge-frontend
    ports:
      - "3000:3000"

volumes:
  devforge_postgres_data: